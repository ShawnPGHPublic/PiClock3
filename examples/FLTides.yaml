# PiClock3 - Show Tides chart and LED time
#
# The FLTides theme draws that rather than a photograph: the sun's daily
# circle, the horizon it crosses twice a year, and a spoke for every hour. From Daytona Beach, FL
#
pages:
  clock-page: {order: 0, layout: FLTides, theme: FLTides}
  maps-page:  {order: 1, layout: bigmaps, theme: FLTides}

units: default

# Flagler Beach, FL
location:
  latitude: 29.4652
  longitude: -81.20760


  # Blank means the machine's own zone, which is right when the clock
  # sits where it is pointed.  Name a zone when it does not.
  # time: 
  # matters is the one at the other end of the flight.
  timezone: 
# Providers supply data and occupy no region.
providers:

  # the daily forecast.  No key: Open-Meteo asks for none.
#  openmeteo: {plugin: PiClock3.OpenMeteo}

  openweathermap:
    plugin: plugins.OpenWeatherMapWind
    apikey: '{apikeys.owmapi}'
    refresh: 30
    forecast-days: 6    

 # wrap Open-Meteo; only current temp comes from MQTT
  mqttweather:
    plugin: plugins.MqttWeather
    weather-provider: openweathermap
    mqtt-host: 192.168.244.50
    mqtt-port: 1883
    mqtt-username: '{apikeys.mqtt-username}'
    mqtt-password: '{apikeys.mqtt-password}'
    mqtt-client-id: 'PICWeather'

    mqtt-topics:
      temp:       {topic: HomeDisplay/tempoutside/state, unit: F}
      # humidity:   {topic: HomeDisplay/humidityoutside/state}
      # wind:       {topic: ha/sensor/outside_wind_speed/state, unit: mph}
      # wind-dir:   {topic: ha/sensor/outside_wind_direction/state}
      # gust:       {topic: ha/sensor/cotech_wind_gust/state, unit: mph}
      # feels-like: {topic: ha/sensor/outside_feels_like/state, unit: F}    
   

  # an actual observation from a nearby field
  metar: {plugin: PiClock3.Metar, METAR: KDAB}

  # base map under the radar - needs a key in ApiKeys.yaml
  mapbox:     {plugin: PiClock3.Mapbox}
  googlemaps: {plugin: PiClock3.GoogleMaps}

  # radar tiles - one plugin per service, neither needs a key.  RainViewer
  # stopped serving tiles above zoom 7 and returns a "Zoom Level Not
  # Supported" card instead; LibreWXR still serves every zoom, so the
  # close-in radars below point at it.
  rainviewer: {plugin: PiClock3.RainViewer}
  librewxr:   {plugin: PiClock3.LibreWXR}

kind-settings:
  digital-clock:
    lowercase: false
    format: "{plugin-data.now:%-H:%M}"
    font-family: "DSEG7 Classic"
    font-weight: bold    
    font-size: 0.3
    color: '#ff1a00' 

# Widgets occupy a region named by the page's layout, and draw in it.
widgets:
#  clock:  {plugin: PiClock3.AnalogClock, region: clock}
  clock:  {plugin: PiClock3.DigitalClock, region: clock}
  date:   {plugin: PiClock3.Date,   region: date}
  astral: {plugin: PiClock3.Astral, region: foot}

  # one day in each cell of the layout's forecast column
  forecast:
    plugin: plugins.ForecastWind
    region: forecast
    forecast-provider: openweathermap
    # six cells along the foot: the next three hours, then three days
    hourly: 3
    daily: 3
    # six cells across a screen leaves each one narrow, so the day is
    # abbreviated where the classic column spells it out
    hour-format: '%a %-I%p'

    layout:
      icon: {width: .5}

  # the strip along the bottom of the maps page
  maps-caption:
    plugin: PiClock3.DigitalClock
    region: caption
    format: "{plugin-data.now:%a %b} {plugin-data.now.day} {plugin-data.now.year}   {plugin-data.now:%H:%M:%S}"
    lowercase: false
    font-size: 0.75

  current-conditions:
    plugin: plugins.CurrentWind
    region: current
    conditions-provider: mqttweather

  # Add Tide clock here
  tides:
    plugin: plugins.tides
    region: model
    station: "8721120"   # optional; Daytona Beach Shores/ nearby NOAA id
    height-units: feet
    footer-height: 0.14
    footer-font-size: 0.38

  radar1:
    plugin: PiClock3.MapLoop
    region: maps
    base-provider: mapbox        # or googlemaps, if that is the key you got
    frame-provider: librewxr     # or rainviewer
    label: 'Airport'
    # the pale default is meant for dark satellite imagery and is the same
    # brightness as ice.  Outlining it keeps the color every other example
    # uses and still reads here, on snow and on open water both.
    label-outline: true
    zoom: 8
    center:
      latitude: '{location.latitude}'
      longitude: '{location.longitude}'
    markers:
      - location:
          latitude: '{location.latitude}'
          longitude: '{location.longitude}'
        color: red
        image: teardrop-home
    
  radar2:
    plugin: PiClock3.MapLoop
    region: radar
    base-provider: mapbox        # or googlemaps, if that is the key you got
    frame-provider: librewxr     # or rainviewer
    label: 'Florida'
    label-outline: true
    zoom: 5
    center:
      latitude:  28.53834	       # Orlando
      longitude:  -81.37924

logging-level: debug

apikeys: !include ApiKeys.yaml
